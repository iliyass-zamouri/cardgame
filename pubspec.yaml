name: shadow_hand
description: Shadow Hand — Flame remake with Camo design system.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^3.0.1
  http: ^1.2.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  uuid: ^4.4.0
  game_protocol:
    path: packages/game_protocol
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
