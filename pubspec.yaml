name: cardgame
description: Multiplayer card game with authoritative WebSocket rooms.
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  web_socket_channel: ^3.0.1
  flame: ^1.35.1
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.6.0
  loading_animation_widget: ^1.3.0
  google_mobile_ads: ^7.0.0
  firebase_core: ^3.12.1
  firebase_analytics: ^11.4.4
  app_tracking_transparency: ^2.0.6
  purchases_flutter: ^10.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#ffffff"
  image: assets/hailsom.png
  android_12:
    image: assets/hailsom.png
    color: "#ffffff"
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/table.jpg
    - assets/crown.svg
    - assets/hailsom.png
    - assets/avatars/
    - assets/icons/
    - assets/flags/
    - assets/pots/
    - assets/logo/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    # Keep the old variable file out of the family registration — it renders
    # as .notdef tofu boxes under flutter_test / Impeller.

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: false
