# coturn relay for in-game voice chat (WebRTC). Secrets, realm and the
# public IP are passed as command-line flags from docker-compose (.env).
#
# OCI: open ingress TCP+UDP 3478 and UDP 49160-49200 in the VCN security
# list AND on the instance firewall (iptables/firewalld), e.g.
#   sudo iptables -I INPUT -p udp --dport 3478 -j ACCEPT
#   sudo iptables -I INPUT -p tcp --dport 3478 -j ACCEPT
#   sudo iptables -I INPUT -p udp --dport 49160:49200 -j ACCEPT
#   sudo netfilter-persistent save

listening-port=3478
min-port=49160
max-port=49200

# Short-lived credentials minted by GET /voice/ice (TURN REST API scheme).
use-auth-secret
fingerprint

no-cli
no-tls
no-dtls
no-multicast-peers
stale-nonce=600

# A 1:1 voice call needs one allocation per player.
user-quota=4
total-quota=400
max-bps=128000

# Never relay into private networks (protects the OCI VCN / docker network).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
